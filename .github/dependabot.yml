version: 2
updates:
  # npm ecosystem: Dependabot detects pnpm from pnpm-lock.yaml
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      game-engine:
        patterns: ['phaser']
      vite-vitest:
        patterns: ['vite', 'vite-plugin-pwa', 'vitest']
      lint-format:
        patterns: ['eslint', '@eslint/*', 'eslint-*', 'typescript-eslint', 'prettier', 'globals']
      testing:
        patterns: ['@playwright/test', '@axe-core/*', '@lhci/*']
      # Everything else: minor and patch updates in a single PR
      minor-and-patch:
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ['*']
