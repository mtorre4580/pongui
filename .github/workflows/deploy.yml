name: Deploy

on:
  # Deploy only after CI passes on main, so a broken commit never reaches the site
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish to Cloudflare Pages
    # Idle until the Cloudflare project exists: set the repository variable
    # CLOUDFLARE_PAGES_PROJECT to its name, and the secrets CLOUDFLARE_API_TOKEN and
    # CLOUDFLARE_ACCOUNT_ID (see README, Deploy).
    if: >-
      vars.CLOUDFLARE_PAGES_PROJECT != '' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build exactly the commit CI validated, not whatever main points to now
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vite build
        env:
          # Optional: analytics stay off when the variable is not set
          VITE_UMAMI_ID: ${{ vars.UMAMI_WEBSITE_ID }}
      # Wrangler runs from the registry at a fixed version: it is a deploy tool, not a project
      # dependency
      - run: pnpm dlx wrangler@4.166.0 pages deploy dist --project-name="$PROJECT" --branch=main
        env:
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
