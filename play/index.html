<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Play Boinky</title>
    <meta
      name="description"
      content="Boinky is a bouncing-ball puzzle game: collect every gem and find the exit. Free, no sign-up, plays offline on desktop, tablet and phone."
    />
    <meta name="theme-color" content="#1d2147" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Boinky" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="game" aria-label="Boinky"></main>
    <!-- Invisible: its padding marks the space the level must keep clear (see gfx/layout.ts) -->
    <div id="layout-probe" aria-hidden="true"></div>

    <!-- Touch steering indicator: where the finger landed (ring) and where it is (knob) -->
    <div id="stick" hidden aria-hidden="true"><div id="stick-knob"></div></div>

    <div id="rotate">
      <svg viewBox="0 0 64 64" width="72" height="72">
        <rect x="18" y="6" width="28" height="48" rx="5" />
        <path d="M10 40a24 24 0 0 0 24 18" />
        <path d="m30 54 4 4-4 4" />
      </svg>
      <p id="rotate-text">Rotate your device to play</p>
    </div>

    <div id="loading">Loading…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
